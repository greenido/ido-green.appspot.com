<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Page Not Found - Ido Green</title>
    <meta name="description" content="That page does not exist. Head back to the projects, writing, or the homepage.">
    <meta name="robots" content="noindex">

    <!-- Absolute paths: this page is served by not-found.php for ANY unmatched
         URL, so relative paths would resolve against the mistyped address. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap">
    <link href="/css/main.css" rel="stylesheet">

    <meta name="theme-color" content="#121429">
    <link rel="icon" sizes="192x192" href="/img/pre-logo.png">

    <style>
        .notfound {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }
        .notfound-card {
            max-width: 620px;
            width: 100%;
            padding: var(--spacing-xl);
            text-align: center;
        }
        .notfound-code {
            font-family: var(--font-display);
            font-size: clamp(4rem, 14vw, 7rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: var(--spacing-sm);
        }
        .notfound-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }
        .notfound-text {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
        }
        .notfound-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            justify-content: center;
        }
    </style>
</head>

<body id="page-top">

    <main class="notfound">
        <div class="glass-card notfound-card">
            <div class="notfound-code">404</div>
            <h1 class="notfound-title">This page went for a run without us</h1>
            <p class="notfound-text">
                The address does not match anything here &mdash; most likely a mistyped URL
                or a link that has moved since it was published.
            </p>
            <div class="notfound-actions">
                <a href="/" class="btn-modern primary">Back to Home</a>
                <a href="/#portfolio" class="btn-modern secondary">Browse Projects</a>
                <a href="/#writing" class="btn-modern secondary">Latest Writing</a>
            </div>
        </div>
    </main>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HPYT8KN9LB"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HPYT8KN9LB');
    </script>

</body>
</html>
