name: Testing with Jest CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ido-green/tests/package-lock.json

      - name: Install dependencies
        working-directory: ido-green/tests
        run: npm ci

      - name: Run smoke tests
        working-directory: ido-green/tests
        run: npm test
        env:
          CI: true
